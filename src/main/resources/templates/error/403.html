<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Access Denied | Eco-Tracker</title>
</head>
<body>
    <div th:fragment="content" class="container py-5 text-center">
        <div class="stat-icon purple mx-auto mb-3" style="width: 70px; height: 70px; font-size: 2rem;">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h2 class="fw-bold mb-2">403 - Access Denied</h2>
        <p class="text-muted mb-4 max-w-500 mx-auto">You do not have the required role or authorization to access this page or resource.</p>
        <a th:href="@{/}" class="btn btn-eco-primary">Return Home</a>
    </div>
</body>
</html>
