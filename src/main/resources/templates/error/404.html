<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Page Not Found | Eco-Tracker</title>
</head>
<body>
    <div th:fragment="content" class="container py-5 text-center">
        <div class="stat-icon amber mx-auto mb-3" style="width: 70px; height: 70px; font-size: 2rem;">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h2 class="fw-bold mb-2">404 - Page Not Found</h2>
        <p class="text-muted mb-4 max-w-500 mx-auto">The requested page or record could not be found or may have been removed.</p>
        <a th:href="@{/}" class="btn btn-eco-primary">Return Home</a>
    </div>
</body>
</html>
