# MySQL 8.x Profile as specified in SRS Section 3.5 & Phase 2
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eco_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:eco_app}
spring.datasource.password=${DB_PASSWORD:CHANGE_THIS_LOCAL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
