# Application Configuration
spring.application.name=EcoTracker
server.port=8080

# Active Profile: 'local' (H2 in MySQL mode) by default for instant out-of-the-box run.
# To run with MySQL 8: set SPRING_PROFILES_ACTIVE=mysql or pass -Dspring.profiles.active=mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Common JPA / Hibernate settings
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Date/Time Format
spring.mvc.format.date-time=iso

# Jackson formatting
spring.jackson.serialization.write-dates-as-timestamps=false

# Thymeleaf cache
spring.thymeleaf.cache=false
